# sampling_config.yaml
# 采样任务的通用设置
global_settings:
  result_base_dir: "/root/retro_synthesis/Mol-RNN/result_train/run_reaction_0601_OOD-jump1" # 所有结果文件的根目录，模型和配置也会从这里加载
  epoch : "1000"
  input_file: "/root/reaction_data/USPTO/OOD_official_split_USPTO_50k/0jump/uspto50k_official_splt_0jump_test_unmapped.smi" # 包含产物^模板^反应物的输入文件路径
  
# 模型和采样参数
sampling_parameters:
  batch_size: 8           # 每次生成多少个样本
  num_batches: 1           # 为每条输入生成多少批次，总样本数 = batch_size * num_batches
  temperature: 1.0         # 采样温度，越高生成结果越多样，越低越保守
  max_sequence_length: 256 # 生成序列的最大长度，防止无限生成

# 输出选项
output_options:
  return_probability: false # 是否返回每个字符的生成概率 (如果True，代码中需添加保存逻辑)
